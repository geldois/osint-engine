name: Publish image

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  build:
    name: Build and push
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          sparse-checkout: deploy

      - name: Verify vars.API_DOMAIN matches the deployed .env
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          EXPECTED_API_DOMAIN: ${{ vars.API_DOMAIN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: EXPECTED_API_DOMAIN
          script_path: deploy/verify-api-domain.sh

      - name: Roll out the image
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: SHA
          script_path: deploy/roll-out.sh

      - name: Wait for health check
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
        run: |
          for _ in $(seq 1 24); do
            if curl -fsS "https://${API_DOMAIN}/health"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::/health never returned 200 after ~120s"
          exit 1
