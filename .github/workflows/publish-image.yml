name: Publish image

"on":
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/geldois/osint-engine:${{ github.ref_name }}

      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/osint-engine
            git pull
            IMAGE_TAG=${{ github.ref_name }} docker compose -f docker-compose.yml -f compose.prod.yml pull
            IMAGE_TAG=${{ github.ref_name }} docker compose -f docker-compose.yml -f compose.prod.yml up -d

      - name: Wait for health check
        run: |
          for _ in $(seq 1 24); do
            if curl -fsS "https://${API_DOMAIN}/health"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::/health never returned 200 after ~120s"
          exit 1
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
