services:
  postgres:
    image: postgres:18
    container_name: osint-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: osint_engine
    ports:
      - "5432:5432"
    volumes:
      - osint-engine-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d osint_engine"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  osint-engine-postgres-data:
