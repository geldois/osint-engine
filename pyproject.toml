[project]
name = "osint-engine"
version = "1.7.0"
description = "Entity relationship graph engine that expands identifiers into a fully traceable network of connections sourced exclusively from official public records"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Angelito Chagas", email = "chagasangelito@gmail.com" }]
keywords = ["brasilapi", "brazil", "cnpj", "entity-resolution", "graph", "osint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "aiosql>=15.0",
  "argon2-cffi>=25.1.0",
  "asyncpg>=0.31.0",
  "cryptography>=49.0.0",
  "fastapi>=0.136",
  "fastapi-throttle>=0.1.8",
  "httpx2>=2.4",
  "openpyxl>=3.1.5",
  "pydantic>=2.13",
  "pyjwt>=2.13.0",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.32",
  "rapidfuzz>=3.14.5",
  "structlog>=25.5",
  "typer>=0.26",
  "uvicorn>=0.48",
]

[project.scripts]
osint-engine = "osint_engine.interface.cli.typer.typer_app:main"

[project.urls]
Repository = "https://github.com/geldois/osint-engine"

[dependency-groups]
dev = [
  "asyncpg-stubs>=0.31.3",
  "basedpyright>=1.39",
  "cosmic-ray==8.4.6",
  "hypothesis>=6.156.1",
  "import-linter==2.13",
  "pytest>=9.0",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.1.0",
  "pytest-language-server>=0.23",
  "python-semantic-release>=10.5",
  "ruff>=0.15",
  "testcontainers[postgres]>=4.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts", ".claude/hooks"]
typeCheckingMode = "strict"
pythonPlatform = "All"
reportMissingTypeStubs = "none"

# The Claude Code hooks run as standalone scripts (their own directory on
# sys.path at runtime), so `import _hook_io` resolves from the hooks root.
# (typeCheckingMode cannot be set per-executionEnvironment; the hooks inherit
# the top-level `strict`, and _hook_io.py is cast-typed to stay clean even
# under the editor's stricter `all` default.)
[[tool.basedpyright.executionEnvironments]]
root = ".claude/hooks"

[tool.hatch.build.targets.wheel]
packages = ["src/osint_engine"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"

[tool.pytest-language-server]
exclude = ["build/**", "dist/**", ".tox/**"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
# Ratchet-only floor: set to the measured baseline, never lower it.
fail_under = 90
show_missing = true

[tool.importlinter]
root_package = "osint_engine"

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
  "osint_engine.interface | osint_engine.infrastructure",
  "osint_engine.application",
  "osint_engine.domain",
]
# The composition root (config.*) is Clean Architecture's Main component: it is
# exempt from the dependency rule because a DI container must import the concrete
# implementations it wires. Ignoring its edge into infrastructure keeps the
# legitimate interface -> config -> infrastructure assembly path from reading as
# an interface -> infrastructure violation.
ignore_imports = ["osint_engine.config.** -> osint_engine.infrastructure.**"]

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D",
  "D100",
  "D101",
  "D203",
  "D212",
  "FURB157",
  "ISC001",
  "RUF012",
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["PLR0913", "PLR0917", "PLR2004", "S101", "S105", "S106", "S603", "S607", "SLF001"]
"scripts/**/*.py" = ["S603", "S607", "T201"]
".claude/hooks/*.py" = ["S603", "S607", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]
parse_squash_commits = true
ignore_merge_commits = true
