[project]
name = "osint-engine"
version = "1.9.0"
description = "Entity relationship graph engine that expands identifiers into a fully traceable network of connections sourced exclusively from official public records"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Angelito Chagas", email = "chagasangelito@gmail.com" }]
keywords = ["brasilapi", "brazil", "cnpj", "entity-resolution", "graph", "osint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "aiosql>=15.0",
  "argon2-cffi>=25.1.0",
  "asyncpg>=0.31.0",
  "cryptography>=49.0.0",
  "fastapi>=0.136",
  "fastapi-throttle>=0.1.8",
  "httpx2>=2.4",
  "openpyxl>=3.1.5",
  "pydantic>=2.13",
  "pyjwt>=2.13.0",
  "python-dotenv>=1.2.2",
  "python-multipart>=0.0.32",
  "structlog>=25.5",
  "typer>=0.26",
  "uvicorn>=0.48",
]

[project.urls]
Repository = "https://github.com/geldois/osint-engine"

[project.scripts]
osint-engine = "osint_engine.interface.cli.typer.typer_app:main"

[project.optional-dependencies]
build = ["uv==0.11.21"]

[dependency-groups]
dev = [
  "actionlint-py==1.7.12.25",
  "asyncpg-stubs>=0.31.3",
  "basedpyright>=1.39",
  "check-jsonschema==0.38.2",
  "cosmic-ray==8.4.6",
  "dprint-py==0.64.3.0",
  "hypothesis>=6.156.1",
  "import-linter==2.13",
  "pytest>=9.0",
  "pytest-asyncio>=1.4",
  "pytest-cov>=7.1.0",
  "pytest-language-server>=0.23",
  "python-semantic-release>=10.5",
  "ruff>=0.15",
  "rumdl==0.3.0",
  "shellcheck-py==0.11.0.1",
  "shfmt-py==4.2.0",
  "sqlc==1.31.1.post1",
  "sqruff==0.39.0",
  "testcontainers[postgres]>=4.14.2",
  "tombi==1.9.1",
  "validate-pyproject[all]==0.27",
  "yamllint==1.38.0",
  "zizmor==1.31.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
failOnWarnings = true
pythonPlatform = "All"
reportMissingTypeStubs = "none"

[tool.coverage.run]
branch = true
source = ["src"]
data_file = ".cache/coverage/.coverage"

[tool.coverage.report]
fail_under = 97
show_missing = true

[tool.hatch.build.targets.wheel]
packages = ["src/osint_engine"]

[tool.importlinter]
root_package = "osint_engine"

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
  "osint_engine.interface | osint_engine.infrastructure",
  "osint_engine.application",
  "osint_engine.domain",
]
ignore_imports = ["osint_engine.config.** -> osint_engine.infrastructure.**"]

[tool.pytest.ini_options]
addopts = "-m 'not real_api_snapshot'"
cache_dir = ".cache/pytest"
filterwarnings = ["error"]
markers = [
  "real_api_snapshot: needs a live external API plus PORTAL_TRANSPARENCIA_API_KEY; periodic-manual only, run via 'scripts fixtures verify'",
]
pythonpath = ["src", "tests", "."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"

[tool.pytest-language-server]
exclude = ["build/**", "dist/**", ".tox/**", ".cache/**"]

[tool.ruff]
line-length = 88
cache-dir = ".cache/ruff"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "CPY001",
  "D",
  "D100",
  "D101",
  "D203",
  "D212",
  "FURB157",
  "ISC001",
  "RUF012",
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = ["PLR0913", "PLR0917", "PLR2004", "S101", "S105", "S106", "S603", "S607", "SLF001"]
"scripts/**/*.py" = ["S603", "S607", "T201"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.rumdl]
line-length = 120
exclude = ["CHANGELOG.md", ".venv", ".cache", "build"]
cache-dir = ".cache/rumdl"

[tool.rumdl.MD003]
style = "atx"

[tool.rumdl.MD004]
style = "dash"

[tool.rumdl.MD013]
reflow = true
reflow-mode = "normalize"

[tool.rumdl.MD049]
style = "asterisk"

[tool.rumdl.MD050]
style = "asterisk"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"
build_command = """
    python -m pip install -e '.[build]'
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
"""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.tombi.files]
exclude = ["uv.lock"]

[tool.tombi.format.rules]
indent-width = 2
line-width = 120

[tool.uv]
required-version = "==0.11.21"
